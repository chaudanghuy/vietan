version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: vietan-db
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always    
    ports:
      - "5202:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: vietan
      MYSQL_USER: vietan
      MYSQL_PASSWORD: whatismysql888
    networks:
      - mysqlnet

  phpmyadmin:
    image: phpmyadmin:5.2.0
    container_name: vietan-phpmyadmin
    restart: always
    ports:
      - "8092:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: 123
    networks:
      - mysqlnet

volumes:
  mysql_data:

networks:
  mysqlnet: